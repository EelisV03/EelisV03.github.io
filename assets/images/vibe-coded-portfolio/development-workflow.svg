<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted portfolio development workflow</title>
  <desc id="desc">Five stages: define the goal, generate the implementation, review the result, revise through pull requests, and publish with GitHub Pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0b1c30"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#20c7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <path d="M0 760C300 650 470 860 780 740s520-40 820-180" fill="none" stroke="#12314c" stroke-width="3"/>
  <text x="100" y="130" fill="#20c7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">DEVELOPMENT WORKFLOW</text>
  <text x="100" y="205" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="54" font-weight="700">From an idea to a deployed portfolio</text>

  <g font-family="Arial, sans-serif">
    <path d="M300 510H420M660 510H780M1020 510H1140" stroke="#20c7ff" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1340 580C1340 720 260 720 260 605" fill="none" stroke="#20c7ff" stroke-width="4" stroke-dasharray="14 14" marker-end="url(#arrow)" opacity=".7"/>

    <g transform="translate(100 330)">
      <rect width="200" height="250" rx="28" fill="#0c2136" stroke="#29445f" stroke-width="2"/>
      <circle cx="100" cy="72" r="36" fill="#102e49" stroke="#20c7ff" stroke-width="3" filter="url(#glow)"/>
      <path d="M82 72h36M100 54v36" stroke="#20c7ff" stroke-width="5" stroke-linecap="round"/>
      <text x="100" y="145" text-anchor="middle" fill="#20c7ff" font-size="20" font-weight="700">01</text>
      <text x="100" y="181" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Define</text>
      <text x="100" y="215" text-anchor="middle" fill="#a9bed4" font-size="19">Goal and content</text>
    </g>

    <g transform="translate(460 330)">
      <rect width="200" height="250" rx="28" fill="#0c2136" stroke="#29445f" stroke-width="2"/>
      <circle cx="100" cy="72" r="36" fill="#102e49" stroke="#20c7ff" stroke-width="3" filter="url(#glow)"/>
      <path d="m82 60-15 12 15 12M118 60l15 12-15 12M107 50 93 94" fill="none" stroke="#20c7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="145" text-anchor="middle" fill="#20c7ff" font-size="20" font-weight="700">02</text>
      <text x="100" y="181" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Generate</text>
      <text x="100" y="215" text-anchor="middle" fill="#a9bed4" font-size="19">AI-assisted code</text>
    </g>

    <g transform="translate(820 330)">
      <rect width="200" height="250" rx="28" fill="#0c2136" stroke="#29445f" stroke-width="2"/>
      <circle cx="100" cy="72" r="36" fill="#102e49" stroke="#20c7ff" stroke-width="3" filter="url(#glow)"/>
      <path d="m81 72 13 13 27-31" fill="none" stroke="#20c7ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="145" text-anchor="middle" fill="#20c7ff" font-size="20" font-weight="700">03</text>
      <text x="100" y="181" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Review</text>
      <text x="100" y="215" text-anchor="middle" fill="#a9bed4" font-size="19">Accuracy and layout</text>
    </g>

    <g transform="translate(1180 330)">
      <rect width="200" height="250" rx="28" fill="#0c2136" stroke="#29445f" stroke-width="2"/>
      <circle cx="100" cy="72" r="36" fill="#102e49" stroke="#20c7ff" stroke-width="3" filter="url(#glow)"/>
      <circle cx="84" cy="58" r="6" fill="#20c7ff"/><circle cx="116" cy="86" r="6" fill="#20c7ff"/><circle cx="84" cy="90" r="6" fill="#20c7ff"/>
      <path d="M84 64v20M90 58h8c12 0 18 7 18 22" fill="none" stroke="#20c7ff" stroke-width="4"/>
      <text x="100" y="145" text-anchor="middle" fill="#20c7ff" font-size="20" font-weight="700">04</text>
      <text x="100" y="181" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Revise</text>
      <text x="100" y="215" text-anchor="middle" fill="#a9bed4" font-size="19">Branch and PR</text>
    </g>

    <g transform="translate(700 650)">
      <rect width="200" height="135" rx="28" fill="#0f304b" stroke="#20c7ff" stroke-width="3" filter="url(#glow)"/>
      <text x="100" y="49" text-anchor="middle" fill="#20c7ff" font-size="20" font-weight="700">05</text>
      <text x="100" y="86" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Publish</text>
      <text x="100" y="114" text-anchor="middle" fill="#a9bed4" font-size="17">GitHub Pages</text>
    </g>
  </g>
</svg>
